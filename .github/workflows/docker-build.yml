name: Docker Build Workflow

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }}    

      - name: Build Docker Image
        run: |
          docker build \
            -t my_app:${{ github.sha }} .
            -t my_app:latest .

      - name: push Docker Image
        run: |
          docker tag my_app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/my_app:${{ github.sha }} 
          docker tag my_app:latest ${{ secrets.DOCKERHUB_USERNAME }}/my_app:latest 
          
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my_app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my_app:latest
