name: Docker Build Workflow

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }}    

      - name: Build Docker Image
        if: success()
        run: |
          docker build \
            -t my_app:${{ github.sha }} \
            -t my_app:latest .

      - name: push Docker Image
        run: |
          docker tag my_app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/my_app:${{ github.sha }} 
          docker tag my_app:latest ${{ secrets.DOCKERHUB_USERNAME }}/my_app:latest 
          
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my_app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my_app:latest
  deploy-to-ec2:
    needs: docker-build
    runs-on: ubuntu-latest

    steps: 
      - name: Deploy-to-ec2
        env:
          EC2_HOST: ${{secrets.EC2_HOST}}
          EC2_USER: ${{secrets.EC2_USER}}
          EC2_SSH_KEY: ${{secrets.EC2_SSH_KEY}}

        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/typistack
          chmod 600 ~/.ssh/typistack
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/typistack $EC2_USER@$EC2_HOST '
          docker pull typistack/my_app:latest &&
          docker stop my_app || true
          docker rm my_app || true
          docker run -d --name my_app --restart unless-stopped -p 3000:3000 typistack/my_app:latest
          
           '


